name: Cập nhật tin tức Biển Đông

on:
  schedule:
    - cron: "23 */2 * * *"   # mỗi 2 giờ (giờ UTC)
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Thu thập tin tức
        run: python3 scripts/fetch_news.py

      - name: Commit nếu có thay đổi
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Không có tin mới."
          else
            git commit -m "Cập nhật tin tức $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
